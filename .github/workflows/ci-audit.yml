name: ci-audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Advisories appear without any code change, so also check weekly.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit (v2.1.2).
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd
        with:
          command: check
