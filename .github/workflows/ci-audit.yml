name: ci-audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Advisories appear without any code change, so also check weekly.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit (v2.1.2).
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9
        with:
          command: check
